name: Daily S&P 500 Auto Feedback & Grading

on:
  schedule:
    # 미국 장 마감 후 매일 화~토 오전 07:00 KST (= UTC 22:00 Mon-Fri)
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

jobs:
  run-daily-feedback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily S&P 500 grading & signal recording
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCAN_SCOPE: "all"
        run: |
          python scripts/daily_feedback_job.py

